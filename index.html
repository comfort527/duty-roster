<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="勤休輪值簿">
<meta name="theme-color" content="#edf1ee">
<link rel="stylesheet" href="css/tokens.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>勤休輪值簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@700&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 勤務板 — sticky top bar (title + view tabs), tool strip, then the working grid; summary chips sit above each grid */

*{box-sizing:border-box}
/* 只給螢幕閱讀器讀、畫面上不顯示 */
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--font-display);font-size:22px;letter-spacing:.06em;margin:0;line-height:1.2}
.brand .yr{font-family:var(--font-data);font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs a{padding:6px 14px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-tab)}
.lockbtn{display:inline-flex;align-items:center;gap:6px;height:34px}
.todaybtn{height:34px;color:var(--alert);border-color:color-mix(in srgb,var(--alert) 55%,transparent);font-weight:700}
.synclight{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--font-data);font-size:12px;color:var(--muted)}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);flex:none}
.synclight[data-state="success"] .sdot{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.synclight[data-state="loading"] .sdot{background:var(--busy)}
.synclight[data-state="error"] .sdot{background:var(--alert)}
.synclight[data-state="error"]{color:var(--alert)}
.synclight[data-state="readonly"] .sdot{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
@media (prefers-reduced-motion:no-preference){.synclight[data-state="loading"] .sdot{animation:spulse 1s ease-in-out infinite}@keyframes spulse{50%{opacity:.25}}}
.bnav{display:none}
.roster tr.today td{background:color-mix(in srgb,var(--alert) 10%,var(--surface))}
.roster tr.hol .dn,.roster tr.hol .dw{color:var(--alert)}
.roster .hn{display:block;font-size:9px;line-height:1.1;color:var(--alert);max-width:5.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.yd.hol::before{content:"";position:absolute;left:1px;top:1px;border-top:6px solid var(--alert);border-right:6px solid transparent;border-top-left-radius:2px}
.lockbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.is-locked .brushbar__group--shift,.is-locked .brushbar__group--year,.is-locked .brushbar__group--leave .brush:not(.frame-brush){display:none}
td.cell.f-r{outline:2.5px solid var(--alert);outline-offset:-3px}
td.cell.f-k{outline:2.5px solid var(--ink);outline-offset:-3px}
.fsw{display:inline-block;width:22px;height:18px;border-radius:3px;border:2.5px solid var(--ink);background:transparent}
.fsw.r{border-color:var(--alert)}
.frame-brush{margin-left:4px}
.is-locked td.cell,.is-locked .yd{cursor:default}
.is-locked td.cell:hover{box-shadow:none}
.is-editing .gridwrap,.is-editing .ywrap{box-shadow:0 0 0 2px var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}

main{padding-block:18px 64px;display:grid;gap:16px}
.note{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:8px;padding:8px 12px}
.note b{color:var(--ink);font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* tool strip */
.tools{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.glabel{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav output{font-family:var(--font-data);font-weight:600;font-size:16px;min-width:8.5em;text-align:center}
.ibtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover,.ibtn:hover{border-color:var(--ink)}
.brush{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:34px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.brush[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel) inset}
.brush .txt{font-size:12px;color:var(--muted);padding:0 4px}

/* chips */
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 5px;border-radius:5px;font-family:var(--font-data);font-weight:600;font-size:13px;letter-spacing:-.02em;background:var(--n-bg);color:var(--n-ink)}
.k-duty{background:var(--duty-bg);color:var(--duty-ink)}
.k-p1{background:var(--p1-bg);color:var(--p1-ink);font-weight:700}
.k-p2{background:var(--p2-bg);color:var(--p2-ink);font-weight:700}
.k-t3{background:var(--t3-bg);color:var(--t3-ink);font-weight:700}
.k-off{background:transparent;color:var(--alert);font-size:16px;font-weight:600}
.k-comp{background:var(--y-comp);color:var(--y-on-ink)}
.k-other{background:var(--y-other);color:var(--y-other-ink,var(--y-on-ink))}
.k-stop{background:var(--y-stop);color:var(--y-on-ink)}
.k-train{background:var(--y-train);color:var(--y-on-ink);box-shadow:inset 0 0 0 1.5px var(--alert)}
.k-work{background:var(--y-work);color:var(--y-work-ink);box-shadow:inset 0 0 0 1px var(--line-strong)}

/* summary chips */
.sum{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.pill .n{font-family:var(--font-data);font-weight:600;font-size:15px}
.pill.ok{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.pill.bad{border-color:color-mix(in srgb,var(--alert) 50%,transparent);background:var(--alert-soft);color:var(--alert)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* roster grid */
.gridwrap{overflow:auto;max-height:calc(100vh - var(--rtoolsH,110px) - 52px);max-height:calc(100dvh - var(--rtoolsH,110px) - 52px);min-height:360px;border:1px solid var(--line);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.roster{min-width:100%}
.roster th,.roster td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;background:var(--surface)}
.roster thead th{position:sticky;top:0;z-index:3;padding:8px 3px 6px;vertical-align:bottom}
.roster .c-date{position:sticky;left:0;z-index:2;width:1%;min-width:0;padding:0 6px;text-align:left;white-space:nowrap}
.roster thead .c-date{z-index:4;font-size:12px;color:var(--muted);font-weight:500}
.roster tfoot th,.roster tfoot td{position:sticky;bottom:0;z-index:2;background:var(--bg);font-family:var(--font-data);font-size:13px;height:30px}
.roster tfoot th,.roster tfoot td{border-top:1px solid var(--line-strong)}
.roster tfoot th{left:0;z-index:4;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:0 8px}
.dn{font-family:var(--font-data);font-weight:600;display:inline-block;min-width:1.6em}
.dw{font-size:12px;color:var(--muted);margin-left:4px}
.roster tr.we th.c-date{background:var(--wk-bg)}
.roster tr.we .dn,.roster tr.we .dw{color:var(--wk-ink)}
.roster tr.we td{background:var(--wk-row)}
.roster tr.today th.c-date{box-shadow:inset 0 0 0 2px var(--alert)}
td.cell{width:60px;min-width:56px;height:28px;cursor:pointer;user-select:none;-webkit-user-select:none}
.roster tr td.cell.is-off{background:var(--off-cell)}
td.cell:hover{box-shadow:inset 0 0 0 1px var(--line-strong)}
td.cell.sel{box-shadow:inset 0 0 0 2px var(--sel)}
.nm{width:60px;border:0;border-bottom:1px dashed var(--line-strong);background:transparent;text-align:center;font-weight:700;font-size:13px;padding:2px 0}
.nm.me{color:var(--accent)}
.offsel{margin-top:6px;width:60px;font-size:11px;font-family:var(--font-data);border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:1px 2px}
.c-note{min-width:109px}
.roster .c-note{text-align:left}
.roster thead .c-note{text-align:left;font-size:12px;color:var(--muted);font-weight:500}
.notesel{display:none}
.otherform{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.otherform label,.otherform .lb{font-size:12px;color:var(--muted)}
.otherform input[type=text]{height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:0 10px;font-size:16px;min-width:0;width:100%}
.oswatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.osw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;padding:0;cursor:pointer}
.osw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.oswatches input[type=color]{width:34px;height:28px;border:1px solid var(--line-strong);border-radius:7px;padding:1px;background:var(--surface)}
.opreview{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.roster th.c-note.n1,.roster td.c-note.n1{background:var(--note1)}
.roster th.c-note.n2,.roster td.c-note.n2{background:var(--note2)}
.note-in{display:block;width:100%;height:27px;border:0;background:transparent;padding:5px 8px 0;font:inherit;font-size:12.5px;line-height:1.3;resize:none;overflow:hidden;color:inherit}
.note-in:focus{outline:2px solid var(--sel);outline-offset:-2px;background:var(--surface)}

/* side panel */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:0;font-weight:500}
.panel-head{display:flex;align-items:center;justify-content:space-between}
.panel-head .ptitle{font-size:15px;color:var(--ink);font-weight:700;letter-spacing:.06em}
.panel-scrim{display:none}
.roster-main{display:grid;gap:12px;min-width:0}
.view-year{display:grid;gap:14px}
.panel__section{display:grid;gap:8px}
.fill-months{gap:4px;font-size:13px}
.fill-months__input{width:4.2em;padding:0 6px;text-align:center}
.val--over{color:var(--alert)}
.dot--ok{color:var(--accent)}
.yd.opreview__abbr{display:inline-flex;width:24px;height:20px;border-radius:4px;align-items:center;justify-content:center;font-weight:700}
.opsbar{margin-left:auto}
.is-locked .opsbar{display:none}
@media (min-width:641px){
  .tools--roster .synclight{margin-left:auto}
  .tools--roster .brushbar{flex-basis:100%;gap:10px 18px}
  .is-editing .tools--roster .brushbar{background:var(--accent-soft);border-radius:10px;padding:8px 10px}
  .tools--roster .group{gap:4px}
  .tools--roster .brush{min-width:34px;padding:0 3px}
  .tools--roster .chip{min-width:26px}
  .tools--roster .brush .txt{padding:0 2px}
  .tools--roster .glabel{margin-right:0}
  .brushbar__group--leave .brush .lf{display:none}
  .brushbar__group--leave .brush .ls{display:flex;width:26px;height:22px;font-family:var(--font-body);font-size:12px;font-weight:700;text-decoration:none}
  .brushbar__group--leave .frame-brush .txt{display:none}
  .panel .panel__section--ops h2{display:none}
  aside.panel{display:none;position:fixed;z-index:31;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
    width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow-panel)}
  html.panel-open aside.panel{display:grid}
  html.panel-open .panel-scrim{display:block;position:fixed;inset:0;z-index:30;background:var(--scrim)}
}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.legend input{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:3px 8px;font-size:13px}
.seq{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seq .step{display:inline-flex;align-items:center;gap:2px}
.seq .arrow{color:var(--muted);font-size:11px}
.seq .x{border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:11px;line-height:1;width:16px;height:16px;border-radius:50%;padding:0;margin-left:1px}
.hint{font-size:12px;color:var(--muted);margin:0}
.hint--error{color:var(--alert)}
.kbd{font-family:var(--font-data);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px}

/* year grid */
.ystats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.ystats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat .lab{font-size:12px;color:var(--muted)}
.stat .val{font-family:var(--font-data);font-weight:600;font-size:24px;line-height:1.3}
.stat .of{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.stat .of .pct{margin-left:.9em}
.stat input{width:4.2em;font-family:var(--font-data);font-weight:600;font-size:22px;border:0;border-bottom:1px dashed var(--line-strong);background:transparent;padding:0}
.meter{position:relative;height:10px;border-radius:5px;background:var(--y-none);overflow:visible;margin-top:8px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--y-rest)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.year{margin:0 auto}
.year th,.year td{padding:0;text-align:center}
.year thead th{font-size:12px;font-weight:500;color:var(--muted);padding:6px 0;position:sticky;top:0;background:var(--surface);z-index:2}
.year .wl{width:34px;font-size:12px;color:var(--muted);font-weight:500}
.year tr.we .wl{color:var(--wk-ink);font-weight:700}
.year tr.we td,.year tr.we th{background:var(--wk-row)}
.year tr.sat td,.year tr.sat th{border-top:2px solid color-mix(in srgb,var(--wk-ink) 55%,transparent)}
.year tr.sun td,.year tr.sun th{border-bottom:2px solid color-mix(in srgb,var(--wk-ink) 55%,transparent)}
.yc{width:44px;height:24px}
.year .yc{padding:1px}
.yd{display:flex;align-items:center;justify-content:center;height:100%;border-radius:3px;font-family:var(--font-data);font-size:12px;font-weight:600;cursor:pointer;background:var(--y-none);color:var(--y-none-ink);position:relative}
.yd:hover{box-shadow:inset 0 0 0 1.5px var(--sel)}
.we .yd{text-decoration:underline;text-underline-offset:2px}
.yd.t-rest{background:var(--y-rest);color:var(--y-on-ink)}
.yd.t-comp{background:var(--y-comp);color:var(--y-on-ink)}
.yd.t-stop{background:var(--y-stop);color:var(--y-on-ink)}
.yd.t-other{background:var(--y-other);color:var(--y-other-ink,var(--y-on-ink))}
.yd.t-train{background:var(--y-train);color:var(--y-on-ink);box-shadow:inset 0 0 0 1.5px var(--alert)}
.yd.t-work{background:var(--y-work);color:var(--y-work-ink);box-shadow:inset 0 0 0 1px var(--line)}
.we .yd.t-work,.we .yd:not([class*="t-"]){color:var(--wk-ink)}
.yd.auto::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.75}
.yd.today{outline:2px solid var(--today);outline-offset:-1px}
.year tfoot th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:4px 6px;white-space:nowrap}
.year tfoot td{font-family:var(--font-data);font-weight:600;font-size:13px;height:26px;border-top:1px solid var(--line)}
.year tr.total td{background:var(--accent-soft);color:var(--ink)}
.year tfoot td.yt{color:var(--accent)}
.ywrap{overflow:auto;max-height:min(78vh,1180px);border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px 8px}
.yd-sw{width:22px;height:18px;border-radius:3px;display:inline-block}

/* toast & copy box */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;display:flex;gap:14px;align-items:center;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--today);font-weight:700;padding:0}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}

.brushbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;min-width:0}
.view-roster > .roster-main,.view-year{grid-template-columns:minmax(0,1fr)}
.tools{min-width:0}
.roster tfoot th{white-space:nowrap}
.mshort{display:none}
.brush .ls{display:none}
.syncform{display:grid;gap:6px}
.syncform label{font-size:12px;color:var(--muted)}
.syncform input{width:100%;min-width:0;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:0 10px;font-size:16px;font-family:var(--font-data)}

/* phone layout */
@media (max-width:640px){
  .top .wrap{padding-block:8px;gap:8px}
  .brand h1{font-size:19px}
  .tabs a{padding:5px 8px;font-size:13px}
  .tabs{padding:2px}
  .lockbtn{width:34px;height:32px;padding:0;justify-content:center;margin-left:auto}
  .todaybtn{height:30px;padding:0 8px;font-size:12px}
  .synclight{height:30px;padding:0 7px;font-size:11px;gap:4px}
  .tools--roster .tabs,.tools--year .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .bnav a{display:grid;justify-items:center;gap:1px;font-size:11px;color:var(--muted);text-decoration:none;padding:2px 0}

<script>
(function(){

const LEAVES=[
  {k:'X',n:'休假',t:'rest',off:true},

LEAVES.forEach(l=>{if(!CM[l.k])CM[l.k]={k:l.k,cls:l.cls,d:l.n};});
const LM=Object.fromEntries(LEAVES.map(l=>[l.k,l]));

  {k:'rest',n:'休假'},{k:'comp',n:'補休24時'},{k:'other',n:'其他假'},

];

function sample(){
  const s={year:2026,people:['隊員甲','隊員乙','隊員丙','隊員丁','隊員戊','隊員己','隊員庚'],
    offsets:[null,0,1,2,3,4,5],seq:['2','值','1','3','X','X'],roster:{},me:1,yearMarks:{},
    target:146,announced:116,desc:{},demo:true};
  [[2026,11],[2026,12]].forEach(([y,m])=>{
    const R=s.roster[ym(y,m)]={};
    s.people.forEach((_,p)=>{R[p]={};
      for(let d=1;d<=dim(y,m);d++){const i=dayIdx(y,m,d);
        R[p][d]=s.offsets[p]==null?['3','X','2','1'][mod(i,4)]:s.seq[mod(i+s.offsets[p],s.seq.length)];}
    });
  });
  let rc=0;
  for(let m=1;m<=10;m++)for(let d=1;d<=dim(2026,m);d++){
    const c=s.seq[mod(dayIdx(2026,m,d)+s.offsets[s.me],s.seq.length)];
    let t='work'; if(c==='X'){rc++;t=rc%3===0?'comp':'rest';}

  }
  const range=(m,a,b,t)=>{for(let d=a;d<=b;d++)s.yearMarks[ds(2026,m,d)]=t;};
  range(3,30,31,'stop');range(4,1,2,'stop');range(6,18,27,'train');range(10,5,13,'train');range(8,17,19,'other');
  return s;
}
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
/* 瀏覽器儲存：失敗時（無痕模式、空間不足）記錄警告，寫入失敗時提示一次，不中斷操作 */
let storageWarned=false;
function readStorage(key){
  try{return localStorage.getItem(key);}
  catch(e){console.warn('無法讀取瀏覽器儲存：'+key,e);return null;}
}
function writeStorage(key,value){
  try{localStorage.setItem(key,value);return true;}
  catch(e){
    console.warn('無法寫入瀏覽器儲存：'+key,e);
    if(!storageWarned){storageWarned=true;toast('這個瀏覽器無法儲存資料（可能是無痕模式或空間已滿），關閉頁面後修改會消失。');}
    return false;
  }
}
function removeStorage(key){
  try{localStorage.removeItem(key);}
  catch(e){console.warn('無法刪除瀏覽器儲存：'+key,e);}
}
function save(){writeStorage(KEY,JSON.stringify(S));if(onSaved)onSaved();}
const RENAME={'先1':'1','先2':'2','3〇':'3','3○':'3','休假':'X','補休24時':'補休','補24':'補休','補24時':'補休','其他假':'其他','公差訓練':'國外','公差':'國外','國外專案':'國外'};
function migrate(s){if(!s)return s;const r=c=>RENAME[c]||c;
  s.seq=(s.seq||[]).map(r);
  Object.values(s.roster||{}).forEach(M=>Object.values(M).forEach(P=>Object.keys(P).forEach(d=>{P[d]=r(P[d]);})));
  const D={};Object.keys(s.desc||{}).forEach(k=>{const n=r(k);if(D[n]==null||k===n)D[n]=s.desc[k];});s.desc=D;return s;}
// 國定假日與補假（依人事總處辦公日曆表規則整理，如有異動請以公告為準）
const HOLIDAYS={
 '2026-01-01':'元旦','2026-02-16':'除夕','2026-02-17':'春節','2026-02-18':'春節','2026-02-19':'春節','2026-02-20':'小年夜補假',
 '2026-02-27':'和平紀念日補假','2026-02-28':'和平紀念日','2026-04-03':'兒童節補假','2026-04-04':'兒童節','2026-04-05':'清明節','2026-04-06':'清明節補假',
 '2026-05-01':'勞動節','2026-06-19':'端午節','2026-09-25':'中秋節','2026-09-28':'教師節','2026-10-09':'國慶日補假','2026-10-10':'國慶日',
 '2026-10-25':'光復節','2026-10-26':'光復節補假','2026-12-25':'行憲紀念日',
 '2027-01-01':'元旦','2027-02-04':'小年夜','2027-02-05':'除夕','2027-02-06':'春節','2027-02-07':'春節','2027-02-08':'春節','2027-02-09':'春節補假','2027-02-10':'春節補假',
 '2027-02-28':'和平紀念日','2027-03-01':'和平紀念日補假','2027-04-04':'兒童節','2027-04-05':'清明節','2027-04-06':'兒童節補假',
 '2027-04-30':'勞動節補假','2027-05-01':'勞動節','2027-06-09':'端午節','2027-09-15':'中秋節','2027-09-28':'教師節',
 '2027-10-10':'國慶日','2027-10-11':'國慶日補假','2027-10-25':'光復節','2027-12-24':'行憲紀念日補假','2027-12-25':'行憲紀念日'
};
const holName=(y,m,d)=>HOLIDAYS[ds(y,m,d)]||'';

function localMe(){try{const v=localStorage.getItem(ME_KEY);return v===null?null:+v;}catch(e){return null;}}
let S=migrate(load())||sample();
{const lm=localMe();if(lm!=null&&S.people[lm]!=null)S.me=lm;}
let cur={y:now.getFullYear(),m:now.getMonth()+1};
if(!S.roster[ym(cur.y,cur.m)]){cur={y:2026,m:12};}
const NOTE_COLS=[{k:'notes',n:'勤務註記',s:'勤務',id:'note'},{k:'notes2',n:'雜務註記1',s:'雜務1',id:'note2'},{k:'notes3',n:'雜務註記2',s:'雜務2',id:'note3'}];

let brush='X',ybrush='rest',painting=false,ypainting=false,lastCell=null,undo=null;

function setC(p,d,c){const R=month();R[p]=R[p]||{};if(c)R[p][d]=c;else delete R[p][d];}
function chip(c){if(!c)return'';const k=CM[c];return '<span class="chip '+(k?k.cls:'')+'">'+(c==='X'?'✕':c==='其他'?esc(otherCell()):esc(c))+'</span>';}
function seqLabel(pos){const c=S.seq[pos];const tot=S.seq.filter(x=>x===c).length;if(tot<2)return c==='X'?'✕':c;
  const n=S.seq.slice(0,pos).filter(x=>x===c).length;return (c==='X'?'✕':c)+'('+(n+1)+')';}

function renderBrushes(){
  const g=$('brushes');g.querySelectorAll('button').forEach(b=>b.remove());
  const items=CODES.map(c=>({k:c.k,html:chip(c.k)})).concat([{k:'erase',html:'<span class="txt">清除</span>'},{k:'select',html:'<span class="txt">選取</span>'}]);
  items.forEach(it=>{const b=document.createElement('button');b.type='button';b.className='brush';b.innerHTML=it.html;
    b.setAttribute('aria-pressed',brush===it.k);b.title=it.k==='erase'?'清除格子':it.k==='select'?'只選取，不修改（貼上用）':'畫筆：'+it.k;
    b.onclick=()=>{brush=it.k;renderBrushes();};g.appendChild(b);});
  const lg=$('lbrushes');lg.querySelectorAll('button').forEach(b=>b.remove());
  LEAVES.filter(l=>l.t!=='work').forEach(l=>{const b=document.createElement('button');b.type='button';b.className='brush';
    b.innerHTML='<span class="yd t-'+l.t+' yd-sw lf" aria-hidden="true"></span><span class="txt lf">'+esc(l.n)+'</span><span class="yd t-'+l.t+' ls" aria-hidden="true">'+esc(ABBR[l.t])+'</span>';b.setAttribute('aria-label',l.n);
    b.setAttribute('aria-pressed',brush===l.k);b.title='畫筆：'+l.n;
    b.onclick=()=>{brush=l.k;renderBrushes();};lg.appendChild(b);});
  [['F:r','r','紅框'],['F:k','k','黑框']].forEach(([k,c,n])=>{const b=document.createElement('button');b.type='button';b.className='brush frame-brush';
    b.innerHTML='<span class="fsw '+c+'" aria-hidden="true"></span><span class="txt lf">'+n+'</span>';b.setAttribute('aria-label',n+'（鎖定時也能標記）');b.title=n+'：點格子加上或取消，鎖定時也能用';
    b.setAttribute('aria-pressed',brush===k);b.onclick=()=>{brush=k;renderBrushes();};lg.appendChild(b);});
}

/* ---------- 月班表：表頭、每日一列、表尾分開組裝 ---------- */
function buildOffsetOptions(p,idx1,len){
  let o='<option value="">手動</option>';
  for(let i=0;i<len;i++){
    const pos=mod(idx1+i,len);
    o+='<option value="'+i+'"'+(S.offsets[p]===i?' selected':'')+'>'+esc(seqLabel(pos))+'</option>';
  }
  return o;
}
function buildPersonHeader(nm,p,idx1,len){
  return '<th scope="col"><label class="visually-hidden" for="nm-'+p+'">第'+(p+1)+'位姓名</label><input class="nm'+(p===S.me?' me':'')+'" id="nm-'+p+'" data-p="'+p+'" value="'+esc(nm)+'">'+
    '<label class="visually-hidden" for="off-'+p+'">'+esc(nm)+' 本月1日的輪序</label><select class="offsel" id="off-'+p+'" data-p="'+p+'">'+buildOffsetOptions(p,idx1,len)+'</select></th>';
}
function buildNoteHeader(c,i){
  const opts=NOTE_COLS.map((o,j)=>'<option value="'+j+'"'+(j===i?' selected':'')+'>'+o.s+'</option>').join('');
  return '<th scope="col" class="c-note n'+i+'"><span class="nlab">'+c.n+'</span><label class="visually-hidden" for="nsel-'+i+'">切換註記欄</label><select class="notesel" id="nsel-'+i+'" data-n="'+i+'">'+opts+'</select></th>';
}
function buildRosterHead(){
  const idx1=dayIdx(cur.y,cur.m,1),len=S.seq.length;
  return '<thead><tr><th class="c-date" scope="col">日期</th>'+
    S.people.map((nm,p)=>buildPersonHeader(nm,p,idx1,len)).join('')+
    NOTE_COLS.map(buildNoteHeader).join('')+'</tr></thead>';
}
function buildDateCell(d){
  const w=wdOf(cur.y,cur.m,d),hn=holName(cur.y,cur.m,d);
  return '<th class="c-date" scope="row"'+(hn?' title="'+hn+'"':'')+'>'+(hn?'<span class="hn">'+hn+'</span>':'')+'<span class="dn">'+d+'</span><span class="dw">'+WD[w]+'</span></th>';
}
function buildShiftCell(p,d){
  const c=getC(p,d),F=getF(p,d),isSel=lastCell&&lastCell.p===p&&lastCell.d===d;
  return '<td class="cell'+(isOff(c)?' is-off':'')+(F?' f-'+F:'')+(isSel?' sel':'')+'" data-p="'+p+'" data-d="'+d+'">'+chip(c)+'</td>';
}
function buildNoteCell(c,i,d,notes){
  return '<td class="c-note n'+i+'"><label class="visually-hidden" for="'+c.id+'-'+d+'">'+cur.m+'/'+d+' '+c.n+'</label><textarea class="note-in" id="'+c.id+'-'+d+'" data-d="'+d+'" data-n="'+i+'" rows="2">'+esc(notes[i][d]||'')+'</textarea></td>';
}
function buildDayRow(d,notes){
  const w=wdOf(cur.y,cur.m,d),isToday=ds(cur.y,cur.m,d)===TODAY,hn=holName(cur.y,cur.m,d);
  return '<tr data-d="'+d+'" class="'+(w>=5?'we ':'')+(isToday?'today ':'')+(hn?'hol':'')+'">'+buildDateCell(d)+
    S.people.map((_,p)=>buildShiftCell(p,d)).join('')+
    NOTE_COLS.map((c,i)=>buildNoteCell(c,i,d,notes)).join('')+'</tr>';
}
function buildRosterFoot(){
  return '<tfoot><tr><th scope="row">休假</th>'+S.people.map((_,p)=>'<td id="fo-'+p+'"></td>').join('')+
    NOTE_COLS.map((_,i)=>'<td class="c-note n'+i+'"></td>').join('')+'</tr></tfoot>';
}
function renderRoster(){
  $('monthLabel').value=cur.y+' 年 '+cur.m+' 月';
  const notes=NOTE_COLS.map(c=>(S[c.k]||{})[ym(cur.y,cur.m)]||{});
  let rows='';
  for(let d=1;d<=dim(cur.y,cur.m);d++)rows+=buildDayRow(d,notes);
  $('rgrid').innerHTML=buildRosterHead()+'<tbody>'+rows+'</tbody>'+buildRosterFoot();
  $('rgrid').dataset.nv=noteView;
  updStats();
}
function updStats(){
  const n=dim(cur.y,cur.m);
  const fd=S.people.map(()=>0),fo=S.people.map(()=>0);
  for(let d=1;d<=n;d++){
    S.people.forEach((_,p)=>{const c=getC(p,d);if(c==='值')fd[p]++;if(isOff(c))fo[p]++;});
  }
  S.people.forEach((_,p)=>{$('fo-'+p).textContent=fo[p];});
  const me=S.people[S.me]||'';
}
function paintCell(td){
  const p=+td.dataset.p,d=+td.dataset.d;
  if(brush==='select')return;
  if(isFrame(brush)){const col=brush.slice(2),cf=getF(p,d);
    if(frameMode==='add'){if(cf===col)return;setF(p,d,col);}else{if(cf!==col)return;setF(p,d,'');}
    td.classList.remove('f-r','f-k');const nf=getF(p,d);if(nf)td.classList.add('f-'+nf);save();return;}
  const c=brush==='erase'?'':brush;if(getC(p,d)===c)return;
  setC(p,d,c);td.innerHTML=chip(c);td.classList.toggle('is-off',isOff(c));updStats();save();
}
function selCell(td){document.querySelectorAll('td.cell.sel').forEach(x=>x.classList.remove('sel'));td.classList.add('sel');lastCell={p:+td.dataset.p,d:+td.dataset.d};}
const rg=$('rgrid');
rg.addEventListener('pointerdown',e=>{if(!editMode&&!isFrame(brush))return;const td=e.target.closest('td.cell');if(!td)return;
  if(e.pointerType==='mouse'){painting=true;e.preventDefault();}
  if(isFrame(brush)){frameMode=getF(+td.dataset.p,+td.dataset.d)===brush.slice(2)?'remove':'add';}else selCell(td);
  paintCell(td);});
rg.addEventListener('pointerover',e=>{if(!painting)return;const td=e.target.closest('td.cell');if(td)paintCell(td);});
window.addEventListener('pointerup',()=>{painting=false;ypainting=false;});
rg.addEventListener('input',e=>{const t=e.target;if(!t.classList.contains('note-in'))return;
  if(/[\r\n]/.test(t.value))t.value=t.value.replace(/[\r\n]+/g,' ');
  const nk=NOTE_COLS[+t.dataset.n||0].k;S[nk]=S[nk]||{};const k=ym(cur.y,cur.m);const M=S[nk][k]||(S[nk][k]={});
  if(t.value)M[t.dataset.d]=t.value;else delete M[t.dataset.d];save();
});
rg.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('note-in')){e.preventDefault();e.target.blur();}});
rg.addEventListener('change',e=>{
  if(e.target.classList.contains('notesel')){noteView=+e.target.value;writeStorage('duty-roster-nv',String(noteView));renderRoster();return;}
  const t=e.target;const p=+t.dataset.p;
  if(t.classList.contains('nm')){S.people[p]=t.value.trim()||('隊員'+(p+1));save();renderYearSel();updStats();}
  if(t.classList.contains('offsel')){
    snap(span());const v=t.value===''?null:+t.value;
    // stored offset relates to day index; option i means day 1 lands at pos mod(idx1+i)
    S.offsets[p]=v;if(v!=null)span().forEach(([y,m])=>fillPerson(p,y,m));save();renderRoster();
    if(v!=null)toast(S.people[p]+' 已依輪序重排 '+spanLabel(),true);
  }
});
function fillPerson(p,y,m){const n=dim(y,m),o=S.offsets[p],L=S.seq.length;if(!L)return;
  const k=ym(y,m),R=S.roster[k]||(S.roster[k]={});R[p]=R[p]||{};
  for(let d=1;d<=n;d++)R[p][d]=S.seq[mod(dayIdx(y,m,d)+o,L)];}
function spanLabel(){const a=span();const f=([y,m])=>m+'月';return f(a[0])+'～'+f(a[a.length-1])+'（'+a.length+' 個月）';}
$('fillN').value=fillCount();
$('fillN').addEventListener('change',e=>{S.fillMonths=fillCount.call(null,S.fillMonths=e.target.value);e.target.value=S.fillMonths;save();});
$('fillBtn').onclick=()=>{const a=span();snap(a);let k=0;S.people.forEach((_,p)=>{if(S.offsets[p]!=null){a.forEach(([y,m])=>fillPerson(p,y,m));k++;}});save();renderRoster();renderYear();toast('已依輪序填入 '+spanLabel()+'，共 '+k+' 人（「手動」的人不變）',true);};
$('clearBtn').onclick=()=>{snap();const k=ym(cur.y,cur.m);S.roster[k]={};NOTE_COLS.forEach(c=>{if(S[c.k])delete S[c.k][k];});if(S.frames)delete S.frames[k];save();renderRoster();renderYear();toast('已清空本月班表、註記與框線',true);};
$('prevM').onclick=()=>{cur.m--;if(cur.m<1){cur.m=12;cur.y--;}lastCell=null;renderRoster();};
$('nextM').onclick=()=>{cur.m++;if(cur.m>12){cur.m=1;cur.y++;}lastCell=null;renderRoster();};

function norm(v){v=String(v).trim().replace(/値/g,'值').replace(/\s+/g,'');
  if(/^[xX✕×╳]$/.test(v))return'X';v=v.replace(/[○◯Oo]/g,'〇');if(v===otherName()||v===otherCell())return'其他';return RENAME[v]||v;}
document.addEventListener('paste',e=>{
  if(!editMode||$('view-roster').hidden||!lastCell)return;
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  const txt=(e.clipboardData||window.clipboardData).getData('text/plain');if(!txt)return;e.preventDefault();
  snap();const rows=txt.replace(/\r/g,'').split('\n');if(rows[rows.length-1]==='')rows.pop();
  const n=dim(cur.y,cur.m);let k=0;
  rows.forEach((r,ri)=>r.split('\t').forEach((v,ci)=>{const p=lastCell.p+ci,d=lastCell.d+ri;if(p<S.people.length&&d<=n){setC(p,d,norm(v));k++;}}));
  save();renderRoster();toast('已貼上 '+k+' 格',true);
});

function renderSeq(){
  $('seq').innerHTML=S.seq.map((c,i)=>(i?'<span class="arrow">→</span>':'')+'<span class="step">'+chip(c)+'<button type="button" class="x" data-i="'+i+'" aria-label="移除第'+(i+1)+'格" title="移除">−</button></span>').join('')||'<span class="hint">輪序是空的，從下方加入班別</span>';
  $('seqAdd').innerHTML=CODES.map(c=>'<button type="button" class="brush" data-k="'+esc(c.k)+'" aria-label="加入 '+esc(c.k)+'">'+chip(c.k)+'</button>').join('');
}
$('seq').addEventListener('click',e=>{const b=e.target.closest('.x');if(!b)return;S.seq.splice(+b.dataset.i,1);fixOffsets();save();renderSeq();renderRoster();});
$('seqAdd').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.seq.push(b.dataset.k);save();renderSeq();renderRoster();});
function fixOffsets(){S.offsets=S.offsets.map(o=>o==null||!S.seq.length?null:o%S.seq.length);}


/* ---------- year ---------- */
function yType(y,m,d){
  const key=ds(y,m,d);if(S.yearMarks[key])return{t:S.yearMarks[key],auto:false};
  const c=((S.roster[ym(y,m)]||{})[S.me]||{})[d];
  if(c)return{t:LM[c]?LM[c].t:'work',auto:true};return{t:'',auto:false};
}
function renderYBrushes(){
  const g=$('ybrushes');g.querySelectorAll('button').forEach(b=>b.remove());
  YT.filter(t=>t.k!=='work').concat([{k:'auto',n:'自動'}]).forEach(t=>{const b=document.createElement('button');b.type='button';b.className='brush';
    b.innerHTML=t.k==='auto'?'<span class="txt">自動</span>':'<span class="yd t-'+t.k+' yd-sw lf" aria-hidden="true"></span><span class="txt lf">'+esc(t.n)+'</span><span class="yd t-'+t.k+' ls" aria-hidden="true">'+esc(ABBR[t.k])+'</span>';if(t.k!=='auto'){b.setAttribute('aria-label',t.n);b.title=t.n;}
    b.setAttribute('aria-pressed',ybrush===t.k);b.onclick=()=>{ybrush=t.k;renderYBrushes();};g.appendChild(b);});
}
function renderYearSel(){$('meSel').innerHTML=S.people.map((n,p)=>'<option value="'+p+'"'+(p===S.me?' selected':'')+'>'+esc(n)+'</option>').join('');}
function setMe(v){S.me=v;writeStorage(ME_KEY,String(v));renderYearSel();renderYear();renderRoster();}
$('meSel').onchange=e=>setMe(+e.target.value);

/* ---------- 年度休假：表頭、表身（同時計數）、表尾、統計卡分開組裝 ---------- */
const sumArr=a=>a.reduce((x,y)=>x+y,0);
const daysInYear=y=>((y%4===0&&y%100!==0)||y%400===0)?366:365;
function buildYearHead(){
  return '<thead><tr><th class="wl">週</th>'+MN.map((m,i)=>'<th><span class="mfull">'+m+'月</span><span class="mshort">'+(i+1)+'</span></th>').join('')+'<th class="wl">全年</th></tr></thead>';
}
function buildYearCell(Y,m,d,w,cnt){
  const t=yType(Y,m,d);if(t.t)cnt[t.t][m-1]++;
  const hy=holName(Y,m,d);
  const tip=m+'/'+d+'（'+WD[w]+'）'+(hy?hy+'・':'')+(t.t?esc(YT.find(x=>x.k===t.t).n):'未標記')+(t.auto?'・自動帶入':'');
  return '<td class="yc"><div class="yd'+(t.t?' t-'+t.t:'')+(t.auto?' auto':'')+(ds(Y,m,d)===TODAY?' today':'')+(hy?' hol':'')+'" data-m="'+m+'" data-d="'+d+'" title="'+tip+'">'+d+'</div></td>';
}
function buildYearBody(Y){
  const off=[];for(let m=1;m<=12;m++)off.push(wdOf(Y,m,1));
  const rows=Math.max(...off.map((o,i)=>o+dim(Y,i+1)));
  const cnt={};YT.forEach(t=>cnt[t.k]=Array(12).fill(0));
  let h='<tbody>';
  for(let r=0;r<rows;r++){
    const w=r%7;
    h+='<tr class="'+(w>=5?'we ':'')+(w===5?'sat':w===6?'sun':'')+'"><th class="wl" scope="row">'+WD[w]+'</th>';
    for(let m=1;m<=12;m++){
      const d=r-off[m-1]+1;
      h+=(d<1||d>dim(Y,m))?'<td class="yc"></td>':buildYearCell(Y,m,d,w,cnt);
    }
    h+='<th class="wl" scope="row">'+WD[w]+'</th></tr>';
  }
  return {html:h+'</tbody>',cnt};
}
const monthTotals=cnt=>Array(12).fill(0).map((_,i)=>cnt.rest[i]+cnt.comp[i]+cnt.other[i]);
function buildYearFoot(cnt){
  const frow=(lab,arr,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><th scope="row">'+esc(lab)+'</th>'+arr.map(v=>'<td>'+(v||'·')+'</td>').join('')+'<td class="yt">'+sumArr(arr)+'</td></tr>';
  return '<tfoot>'+frow('休假',cnt.rest)+frow('補休24時',cnt.comp)+frow(otherName(),cnt.other)+frow('停休',cnt.stop)+frow('國外專案',cnt.train)+frow('月總休假',monthTotals(cnt),'total')+'</tfoot>';
}
function renderYearStats(Y,cnt){
  const YD=daysInYear(Y),T=sumArr(monthTotals(cnt));
  const tgt=+S.target||0,ann=+S.announced||0,diff=tgt-T;
  const pct=tgt?Math.min(100,T/tgt*100):0,apct=tgt?Math.min(100,ann/tgt*100):0;
  const ys=$('ystats');ys.innerHTML=
    '<div class="stat"><div class="lab"><label for="tgt">年總應休日數</label></div><input id="tgt" type="number" min="0" value="'+tgt+'"></div>'+
    '<div class="stat"><div class="lab"><label for="ann">人事總處公告</label></div><input id="ann" type="number" min="0" value="'+ann+'"></div>'+
    '<div class="stat"><div class="lab">已排月總休假</div><div class="val">'+T+'<small class="of">/'+YD+'<span class="pct">'+Math.round(T/YD*100)+'%</span></small></div><div class="meter" title="黑線為人事總處公告日數"><i data-js="meter-fill"></i><b data-js="meter-mark"></b></div></div>'+
    '<div class="stat"><div class="lab">'+(diff>=0?'距應休尚差':'超出應休')+'</div><div class="val'+(diff>=0?'':' val--over')+'">'+Math.abs(diff)+'</div><div class="lab">休假 '+sumArr(cnt.rest)+' ＋ 補休 '+sumArr(cnt.comp)+' ＋ '+esc(otherCell())+' '+sumArr(cnt.other)+'</div></div>';
  ys.querySelector('[data-js="meter-fill"]').style.width=pct+'%';
  ys.querySelector('[data-js="meter-mark"]').style.left=apct+'%';
}
function renderYear(){
  const Y=S.year;$('yearLabel').value=Y+' 年';
  const body=buildYearBody(Y);
  $('ygrid').innerHTML=buildYearHead()+body.html+buildYearFoot(body.cnt);
  renderYearStats(Y,body.cnt);
}
$('ystats').addEventListener('change',e=>{if(e.target.id==='tgt')S.target=+e.target.value;if(e.target.id==='ann')S.announced=+e.target.value;save();renderYear();});
const yg=$('ygrid');
function ypaint(el){const m=+el.dataset.m,d=+el.dataset.d,key=ds(S.year,m,d);
  if(ybrush==='auto'){if(!S.yearMarks[key])return;delete S.yearMarks[key];}else{if(S.yearMarks[key]===ybrush)return;S.yearMarks[key]=ybrush;}
  save();}
yg.addEventListener('pointerdown',e=>{if(!editMode)return;const el=e.target.closest('.yd');if(!el)return;if(e.pointerType==='mouse'){ypainting=true;e.preventDefault();}ypaint(el);renderYear();});
yg.addEventListener('pointerover',e=>{if(!ypainting)return;const el=e.target.closest('.yd');if(!el)return;const before=JSON.stringify(S.yearMarks[ds(S.year,+el.dataset.m,+el.dataset.d)]);ypaint(el);if(before!==JSON.stringify(S.yearMarks[ds(S.year,+el.dataset.m,+el.dataset.d)]))renderYear();});
$('prevY').onclick=()=>{S.year--;save();renderYear();};
$('nextY').onclick=()=>{S.year++;save();renderYear();};

/* ---------- shell ---------- */
function route(){
  const v=location.hash==='#year'?'year':location.hash==='#tools'?'tools':'roster';
  $('view-roster').hidden=v==='year';$('view-year').hidden=v!=='year';
  document.documentElement.classList.toggle('view-tools',v==='tools');
  document.querySelectorAll('[data-tab]').forEach(a=>{const on=a.dataset.tab===v||(v==='tools'&&a.dataset.tab==='roster'&&!a.closest('.bnav'));
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  if(v==='year')renderYear();
  if(v==='tools'&&!isPhoneW())openPanel('seqBox');
}
const isPhoneW=()=>matchMedia('(max-width:640px)').matches;
function openPanel(target){document.documentElement.classList.add('panel-open');const el=target&&$(target);if(el)setTimeout(()=>el.scrollIntoView({block:'nearest'}),20);}
function closePanel(){document.documentElement.classList.remove('panel-open');if(location.hash==='#tools')history.replaceState(null,'','#roster');}
$('panelClose').onclick=closePanel;$('panelScrim').onclick=closePanel;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.documentElement.classList.contains('panel-open'))closePanel();});
$('seqBtn').onclick=()=>openPanel('seqBox');
// 電腦版：本月操作按鈕放在第二條工具帶；手機版：放回「設定」頁
function placeOps(){const g=$('opsGroup');if(isPhoneW()){if(g.parentElement!==$('opsHome'))$('opsHome').appendChild(g);}else if(g.parentElement!==$('opsBar'))$('opsBar').insertBefore(g,$('seqBtn'));}
matchMedia('(max-width:640px)').addEventListener('change',()=>{placeOps();if(isPhoneW())document.documentElement.classList.remove('panel-open');});
placeOps();

/* ---------- 鎖定／編輯模式：預設鎖定，按「開始編輯」才能修改 ---------- */
let editMode=false;
const ICON_LOCK='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
const ICON_OPEN='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 7.7-1.5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
function applyLock(){
  const L=!editMode;
  document.documentElement.classList.toggle('is-locked',L);
  document.documentElement.classList.toggle('is-editing',!L);
  document.querySelectorAll('#rgrid .nm,#tgt,#ann').forEach(el=>{el.readOnly=L;});  // 勤務註記不受鎖定
  document.querySelectorAll('#rgrid .offsel,#fillBtn,#clearBtn,#fillN,#seq button,#seqAdd button,#otherName,#otherSw button,#otherSw input').forEach(el=>{el.disabled=L;});
  document.querySelectorAll('.lockbtn').forEach(b=>{b.setAttribute('aria-pressed',String(!L));
    b.innerHTML=(L?ICON_LOCK:ICON_OPEN)+'<span class="txt">'+(L?'開始編輯':'完成編輯')+'</span>';
    b.setAttribute('aria-label',L?'目前鎖定，按一下開始編輯':'編輯中，按一下鎖定');b.title=L?'開始編輯':'完成編輯並鎖定';});
  if(L){document.querySelectorAll('td.cell.sel').forEach(x=>x.classList.remove('sel'));lastCell=null;
    const a=document.activeElement;if(a&&a.closest&&a.closest('#rgrid,#ystats')&&!a.classList.contains('note-in'))a.blur();}
}
document.addEventListener('click',e=>{const b=e.target.closest('.lockbtn');if(!b)return;editMode=!editMode;applyLock();
  toast(editMode?'已開始編輯':'已鎖定，班表不會被誤觸修改');});
{const r1=renderRoster,r2=renderYear,r3=renderSeq;
 renderRoster=function(){r1();applyLock();$('opsTitle').textContent='本月操作・'+cur.y+' 年 '+cur.m+' 月';};renderYear=function(){r2();applyLock();};renderSeq=function(){r3();applyLock();};}
/* ---------- 其他假：可自訂名稱與顏色（存在班表資料裡，會跟著同步） ---------- */
// 預設色定義在 CSS 變數 --other-preset-1～7
const OTHER_COLORS=[1,2,3,4,5,6,7].map(i=>getComputedStyle(document.documentElement).getPropertyValue('--other-preset-'+i).trim()).filter(Boolean);
function otherName(){return((S.other&&S.other.name)||'其他假').trim()||'其他假';}
function otherCell(){const n=otherName();const t=n.length>2?n.replace(/假$/,''):n;return t.slice(0,2);}
function otherColor(){const c=S.other&&S.other.color;return /^#[0-9a-f]{6}$/i.test(c||'')?c:OTHER_COLORS[0];}
function inkFor(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return (0.299*r+0.587*g+0.114*b)>165?'var(--on-light-ink)':'var(--y-on-ink)';}
function applyOtherCfg(){
  const n=otherName(),c=otherColor();
  LM['其他'].n=n;CM['其他'].d=n;const yt=YT.find(t=>t.k==='other');if(yt)yt.n=n;ABBR.other=otherCell().slice(0,1);
  document.documentElement.style.setProperty('--y-other',c);document.documentElement.style.setProperty('--y-other-ink',inkFor(c));
  const inp=$('otherName');if(document.activeElement!==inp)inp.value=(S.other&&S.other.name)||'';
  $('otherSw').innerHTML=OTHER_COLORS.map(x=>'<button type="button" class="osw" data-c="'+x+'" aria-label="顏色 '+x+'" aria-pressed="'+(x.toLowerCase()===c.toLowerCase())+'"></button>').join('')+
    '<label class="visually-hidden" for="otherColor">自訂顏色</label><input type="color" id="otherColor" value="'+c+'" title="自訂顏色">';
  $('otherSw').querySelectorAll('.osw').forEach(b=>{b.style.background=b.dataset.c;});
  $('otherPrev').innerHTML='格子 '+chip('其他')+'　縮寫 <span class="yd t-other opreview__abbr">'+esc(ABBR.other)+'</span>';
}
function setOther(patch){S.other=Object.assign({},S.other||{},patch);save();renderAll();}
$('otherName').addEventListener('input',e=>{if(!editMode)return;setOther({name:e.target.value.trim()});});
$('otherSw').addEventListener('click',e=>{const b=e.target.closest('.osw');if(!b||!editMode)return;setOther({color:b.dataset.c});});
$('otherSw').addEventListener('change',e=>{if(e.target.id==='otherColor'&&editMode)setOther({color:e.target.value});});
function renderAll(){applyOtherCfg();renderBrushes();renderSeq();renderRoster();renderYearSel();renderYBrushes();renderYear();route();}
window.addEventListener('hashchange',route);
renderAll();
// 手機：功能列固定在上方，表頭姓名接在功能列下面
/* 今天：跳到本月並捲到今天那一列 */
function scrollToToday(smooth){
  const tr=document.querySelector('#rgrid tbody tr.today');if(!tr)return;
  const wrap=$('rgridwrap'),head=$('rgrid').tHead,b=smooth?'smooth':'auto';
  if(getComputedStyle(wrap).overflowY==='visible'){
    const ref=tr.previousElementSibling||tr;
    window.scrollTo({top:Math.max(0,ref.getBoundingClientRect().top+window.scrollY-$('rtools').offsetHeight-head.offsetHeight),behavior:b});
  }else wrap.scrollTo({top:Math.max(0,tr.offsetTop-head.offsetHeight-tr.offsetHeight),behavior:b});
}
$('todayBtn').onclick=()=>{const t=new Date();if(location.hash==='#tools')location.hash='#roster';
  cur={y:t.getFullYear(),m:t.getMonth()+1};lastCell=null;renderRoster();requestAnimationFrame(()=>scrollToToday(true));};
if(cur.y===now.getFullYear()&&cur.m===now.getMonth()+1)setTimeout(()=>scrollToToday(false),60);
document.addEventListener('click',e=>{if(!e.target.closest('[data-sync]'))return;
  if(isPhoneW()){if(location.hash!=='#tools')location.hash='#tools';setTimeout(()=>$('syncBox').scrollIntoView({behavior:'smooth',block:'center'}),50);}
  else openPanel('syncBox');});
if(window.ResizeObserver){const ro=new ResizeObserver(es=>es.forEach(en=>{const el=en.target;document.documentElement.style.setProperty('--'+el.id+'H',(el.offsetHeight||0)+'px');}));ro.observe($('rtools'));ro.observe($('ytools'));}

/* ---------- 雲端同步（GitHub：把班表存成私人 repo 裡的 data.json） ---------- */
const GHK='duty-roster-gh';            // 每台裝置各自記住 repo 與 token（只存在本機瀏覽器）
const DATA_PATH='data.json',DATA_BRANCH='data',PUBLIC_REPO='comfort527/duty-roster'; // 資料放在獨立的 data 分支，不會觸發網頁重新部署
let pubText=null;
const CLIENT=Math.random().toString(36).slice(2);
let gh=null,ghSha=null,ghEtag=null,pushT=null,pendingRemote=null,pollT=null;
try{gh=JSON.parse(localStorage.getItem(GHK)||'null');}catch(e){gh=null;}
// 同步狀態：同步燈與訊息都由這一個狀態決定
const SYNC_STATUS={IDLE:'idle',LOADING:'loading',SUCCESS:'success',ERROR:'error',READONLY:'readonly'};
const SYNC_LIGHT_TEXT={idle:'本機',loading:'同步中',error:'失敗',readonly:'唯讀'};
let syncStatus=SYNC_STATUS.IDLE;
function setSync(status,msg){
  syncStatus=status;
  const m=$('syncMsg');m.textContent=msg;m.classList.toggle('hint--error',status===SYNC_STATUS.ERROR);
  const light=status===SYNC_STATUS.SUCCESS?hhmm():SYNC_LIGHT_TEXT[status];
  document.querySelectorAll('[data-sync]').forEach(b=>{b.dataset.state=status;b.querySelector('.stime').textContent=light;b.title=msg;b.setAttribute('aria-label','同步狀態：'+msg);});
}
function hhmm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function b64dec(b64){const bin=atob(b64.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function api(method,body,extra){
  return fetch('https://api.github.com/repos/'+gh.repo+'/contents/'+DATA_PATH+(method==='GET'?'?ref='+DATA_BRANCH:''),{method,cache:'no-store',
    headers:Object.assign({'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{},extra||{}),
    body:body?JSON.stringify(body):undefined});
}
function errMsg(st){return st===401?'Token 無效或已過期，請重新設定。':st===403?'Token 沒有這個 repo 的寫入權限。':st===404?'找不到 repo，或 Token 沒有這個 repo 的權限。':'同步失敗（'+st+'）';}
function renderSync(){
  const on=!!(gh&&gh.token&&gh.repo);
  $('syncRow').innerHTML=on
    ?'<span class="pill"><span class="dot dot--ok"></span>'+esc(gh.repo)+'</span><button class="btn" id="syncNow" type="button">立即同步</button><button class="btn" id="syncEdit" type="button">設定</button>'
    :'<button class="btn primary" id="syncEdit" type="button">設定 GitHub 同步</button>';
  $('syncEdit').onclick=()=>{const f=$('syncForm');f.hidden=!f.hidden;if(!f.hidden){$('ghRepo').value=(gh&&gh.repo)||PUBLIC_REPO;$('ghToken').value=(gh&&gh.token)||'';}};
  if(on)$('syncNow').onclick=()=>pull(true);
  if(!on)setSync(SYNC_STATUS.READONLY,'唯讀：顯示 GitHub 上的班表。設定 Token 後才能把修改上傳。');
}
function editing(){const a=document.activeElement;return a&&a.closest&&a.closest('#rgrid')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);}
function applyRemote(json){
  if(editing()){pendingRemote=json;return;}
  pendingRemote=null;
  try{const d=JSON.parse(json);S=migrate(d.state||d);}catch(e){return;}
  {const lm=localMe();if(lm!=null&&S.people[lm]!=null)S.me=lm;}
  writeStorage(KEY,JSON.stringify(S));
  renderAll();
}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRemote&&!editing())applyRemote(pendingRemote);},0);});
function reportBadResponse(step,body){
  console.error('GitHub '+step+'回應格式不正確',body);
  setSync(SYNC_STATUS.ERROR,'同步失敗：GitHub 回應格式不正確，請稍後按「立即同步」。');
}
async function pull(force){
  if(!gh||pushT||syncStatus===SYNC_STATUS.LOADING)return;   // 有修改等待上傳或上傳中時，不從雲端拉
  try{
    const r=await api('GET',null,(!force&&ghEtag)?{'If-None-Match':ghEtag}:null);
    if(r.status===304){setSync(SYNC_STATUS.SUCCESS,'已同步 '+hhmm());return;}
    if(r.status===404&&!ghSha){await push();return;}   // 雲端還沒有資料：上傳這台的
    if(!r.ok){setSync(SYNC_STATUS.ERROR,errMsg(r.status));return;}
    ghEtag=r.headers.get('ETag');
    const j=await r.json().catch(()=>null);
    const sha=j?.sha??null,content=j?.content??null;
    if(!sha||!content){ghEtag=null;reportBadResponse('讀取',j);return;}
    if(sha!==ghSha){ghSha=sha;applyRemote(b64dec(content));}
    setSync(SYNC_STATUS.SUCCESS,'已同步 '+hhmm());
  }catch(e){
    console.error('同步讀取失敗',e);
    if(e instanceof TypeError)setSync(SYNC_STATUS.ERROR,'連不到 GitHub。若是在 Claude 預覽頁，請改用 GitHub Pages 網址開啟。');
    else setSync(SYNC_STATUS.ERROR,'同步失敗：GitHub 回應格式不正確，請稍後按「立即同步」。');
  }
}
async function push(){
  if(!gh)return;pushT=null;setSync(SYNC_STATUS.LOADING,'同步中…');
  const body=()=>({message:'更新班表 '+new Date().toLocaleString('zh-TW',{hour12:false}),
    content:b64enc(JSON.stringify({updatedAt:new Date().toISOString(),client:CLIENT,state:S})),sha:ghSha||undefined,branch:DATA_BRANCH});
  try{
    let r=await api('PUT',body());
    if(r.status===409||r.status===422){        // 別台剛更新過：取得最新版本號後，以這次的修改覆蓋
      const g=await api('GET');if(g.ok){const gj=await g.json().catch(()=>null);ghSha=gj?.sha??ghSha;r=await api('PUT',body());}
    }
    if(!r.ok){setSync(SYNC_STATUS.ERROR,errMsg(r.status));}
    else{
      const j=await r.json().catch(()=>null);const sha=j?.content?.sha??null;ghEtag=null;
      if(!sha)reportBadResponse('上傳',j);else{ghSha=sha;setSync(SYNC_STATUS.SUCCESS,'已同步 '+hhmm());}
    }
  }catch(e){setSync(SYNC_STATUS.ERROR,'連不到 GitHub，修改先存在這台裝置，連線後會再上傳。');pushT=setTimeout(push,15000);}
}
onSaved=()=>{if(!gh){setSync(SYNC_STATUS.ERROR,'這台還沒設定 Token，修改只存在本機，之後會被 GitHub 上的版本取代。');return;}setSync(SYNC_STATUS.LOADING,'等待上傳…');clearTimeout(pushT);pushT=setTimeout(push,3000);};
$('syncForm').addEventListener('submit',e=>{e.preventDefault();
  const repo=$('ghRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),token=$('ghToken').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){setSync(SYNC_STATUS.ERROR,'請填 repo（例如 comfort527/duty-roster）和 Token。');return;}
  gh={repo,token};ghSha=null;ghEtag=null;writeStorage(GHK,JSON.stringify(gh));
  $('syncForm').hidden=true;renderSync();startSync();});
$('ghOff').onclick=()=>{gh=null;removeStorage(GHK);clearInterval(pollT);$('syncForm').hidden=true;renderSync();startSync();};
function startSync(){
  clearInterval(pollT);
  if(!gh){pullPublic();pollT=setInterval(()=>{if(document.visibilityState==='visible')pullPublic();},60000);return;}
  pull(true);
  pollT=setInterval(()=>{if(document.visibilityState==='visible')pull(false);},30000);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(gh)pull(false);else pullPublic();});
// 沒有 Token 的裝置：從公開網址讀取（唯讀）
async function pullPublic(){
  if(gh)return;
  try{const r=await fetch('https://raw.githubusercontent.com/'+PUBLIC_REPO+'/'+DATA_BRANCH+'/'+DATA_PATH+'?t='+Date.now(),{cache:'no-store'});
    if(r.status===404)return;   // 雲端還沒有資料：維持本機班表，不提示
    if(!r.ok)throw new Error('HTTP '+r.status);
    const t=await r.text();if(t!==pubText){pubText=t;applyRemote(t);}setSync(SYNC_STATUS.READONLY,'唯讀：已載入 GitHub 上的班表 '+hhmm()+'。設定 Token 後才能上傳修改。');}
  catch(e){
    console.error('唯讀載入失敗',e);
    const why=e instanceof TypeError?'連不到 GitHub':(e?.message??'連不到 GitHub');
    setSync(SYNC_STATUS.ERROR,'唯讀載入失敗（'+why+'），畫面可能不是最新班表；稍後會自動重試。');
  }
}
renderSync();startSync();
})();
